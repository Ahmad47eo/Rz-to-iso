<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" href="./wasm_exec.js??v=fix20260923" as="script">
<link rel="preload" href="./rvz.wasm" as="fetch" type="application/wasm" crossorigin>
<title>RVZ → ISO Converter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#f5f7ff;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(720px,100%);background:#151b2f;border:1px solid #293252;border-radius:24px;padding:26px;box-shadow:0 20px 60px #0006}h1{margin:0 0 8px;font-size:clamp(28px,7vw,46px)}p{color:#aeb8d4;line-height:1.5}.drop{margin-top:22px;border:2px dashed #52618d;border-radius:18px;padding:38px 18px;text-align:center;cursor:pointer;background:#10162a}.drop.drag{border-color:#8da5ff;background:#17203b}.btn{margin-top:16px;padding:12px 18px;border:0;border-radius:12px;background:#6d82ff;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:18px;padding:14px;border-radius:12px;background:#0e1426;color:#cbd3eb;white-space:pre-wrap;word-break:break-word}.bar{height:8px;background:#252d48;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#8da5ff}.small{font-size:12px;color:#8f9ab8;margin-top:16px}
</style>
</head>
<body>
<main class="card">
<h1>RVZ → ISO</h1>
<p>Local RVZ decompression for your own Wii/GameCube disc images. The file stays on your device and is processed locally.</p>
<div id="drop" class="drop"><strong>Drop an .rvz file here</strong><br><span>or tap to choose a file</span><input id="file" type="file" accept=".rvz" hidden></div>
<button id="convert" class="btn" disabled>Convert to ISO</button>
<div class="bar"><i id="bar"></i></div>
<div id="status" class="status">Loading decoder…</div>
<div class="small">The converter uses a small worker-side read cache and writes the ISO directly to local browser storage.</div>
</main>
<script>
const drop=document.querySelector('#drop'),input=document.querySelector('#file'),button=document.querySelector('#convert'),status=document.querySelector('#status'),bar=document.querySelector('#bar');
let selected=null,ready=false,worker=null;
const OUT_NAME='rvz-output.iso';
function setStatus(s){status.textContent=s}
function setFile(f){
  selected=f;
  if(!f)return;
  if(!/\.rvz$/i.test(f.name)){setStatus('Please choose an .rvz file.');button.disabled=true;return}
  button.disabled=!ready;
  setStatus('Selected: '+f.name+'\nInput: '+(f.size/1073741824).toFixed(2)+' GB\nReady.');
}
drop.onclick=()=>input.click();
input.onchange=()=>setFile(input.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));

async function init(){
  try{
    worker=new Worker('./worker.js??v=fix20260923', {type:'classic'});
    worker.onmessage=async e=>{
      const m=e.data||{};
      if(m.type==='ready'){
        ready=true;button.disabled=!selected;
        setStatus(selected?'Selected: '+selected.name+'\nReady.':'Decoder ready. Choose an RVZ file.');
      }else if(m.type==='started'){
        setStatus('Converting…\nStarting decoder…');
      }else if(m.type==='reading'){
        setStatus('Reading RVZ…');
      }else if(m.type==='progress'){
        bar.style.width=Math.min(100,(m.done/m.total)*100)+'%';
        setStatus('Converting…\n'+(m.done/1073741824).toFixed(2)+' / '+(m.total/1073741824).toFixed(2)+' GB\nChunk '+m.step+' • '+m.stepMs+' ms');
      }else if(m.type==='done'){
        try{
          const root=await navigator.storage.getDirectory();
          const h=await root.getFileHandle(OUT_NAME);
          const file=await h.getFile();
          const a=document.createElement('a');
          a.href=URL.createObjectURL(file);
          a.download=m.name||'output.iso';
          a.click();
          setTimeout(()=>URL.revokeObjectURL(a.href),60000);
          setStatus('Done!\nISO size: '+(m.size/1073741824).toFixed(2)+' GB\nDownload started.');
          bar.style.width='100%';
        }catch(err){setStatus('ISO created, but download failed: '+err.message)}
        button.disabled=false;
      }else if(m.type==='error'){
        setStatus('Conversion failed: '+m.message+'\nLast chunk: '+(m.step||0)+' • '+(m.stepMs||0)+' ms');
        button.disabled=false;
      }
    };
    worker.onerror=e=>{
      setStatus('Decoder worker stopped. The browser may have terminated it because of memory/CPU pressure. Try a smaller RVZ or a desktop browser.');
      button.disabled=false;
    };
  }catch(e){setStatus('Could not start decoder: '+e.message)}
}
async function convert(){
  if(!selected||!ready)return;
  button.disabled=true;bar.style.width='0%';setStatus('Starting local conversion…');
  try{
    worker.postMessage({type:'start',file:selected,name:selected.name.replace(/\.rvz$/i,'')+'.iso'});
  }catch(e){
    setStatus('Could not start conversion: '+e.message);
    button.disabled=false;
  }
}
button.onclick=convert;
init();
</script>
</body>
</html>
