name: Build and deploy RVZ converter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build RVZ WebAssembly decoder
        run: |
          mkdir -p public
          cat > go.mod <<'EOF'
          module rvz-web

          go 1.24

          require github.com/bodgit/rvz v1.0.3
          EOF
          go mod tidy
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o public/rvz.wasm ./cmd/rvzwasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" public/wasm_exec.js

      - name: Prepare site
        run: cp index.html public/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
